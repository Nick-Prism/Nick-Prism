<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="ttl">
  <title id="ttl">Animated diagram: an orchestrator exchanging messages with six cooperating agents — plan, RAG, graph, tools, critic, memory</title>
  <defs>
    <radialGradient id="core" cx=".38" cy=".34" r=".85">
      <stop offset="0" stop-color="#cfe3ff"/>
      <stop offset=".45" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity=".30"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <style>
      @font-face { font-family:'CG Caps'; font-weight:600; font-style:normal;
        src:url(data:font/woff2;base64,) format('woff2'); }
      .lab { font:600 11.5px 'CG Caps', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
              letter-spacing:2.4px; fill:#8b98a9; }
    </style>
  </defs>

  <!-- slow outer orbit -->
  <g>
    <circle cx="200" cy="200" r="185" fill="none" stroke="#58A6FF" stroke-opacity=".30" stroke-width="1" stroke-dasharray="1.5 7"/>
    <g>
      <circle cx="373.8" cy="263.3" r="2.6" fill="#58A6FF"/>
      <circle cx="58.3" cy="318.9" r="2.6" fill="#58A6FF"/>
      <circle cx="174.3" cy="16.8" r="2.6" fill="#58A6FF"/>
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="70s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- agent ring guide -->
  <circle cx="200" cy="200" r="108" fill="none" stroke="#58A6FF" stroke-opacity=".12" stroke-width="1"/>
  <circle cx="200" cy="200" r="78" fill="url(#halo)"/>

  <!-- links -->
  <g>
    <line x1="200" y1="200" x2="200.0" y2="92.0" stroke="#58A6FF" stroke-opacity=".38" stroke-width="1"/>
    <line x1="200" y1="200" x2="293.5" y2="146.0" stroke="#58A6FF" stroke-opacity=".38" stroke-width="1"/>
    <line x1="200" y1="200" x2="293.5" y2="254.0" stroke="#58A6FF" stroke-opacity=".38" stroke-width="1"/>
    <line x1="200" y1="200" x2="200.0" y2="308.0" stroke="#58A6FF" stroke-opacity=".38" stroke-width="1"/>
    <line x1="200" y1="200" x2="106.5" y2="254.0" stroke="#58A6FF" stroke-opacity=".38" stroke-width="1"/>
    <line x1="200" y1="200" x2="106.5" y2="146.0" stroke="#58A6FF" stroke-opacity=".38" stroke-width="1"/>
    <polygon points="200.0,92.0 293.5,146.0 293.5,254.0 200.0,308.0 106.5,254.0 106.5,146.0" fill="none" stroke="#58A6FF" stroke-opacity=".34" stroke-width="1" stroke-dasharray="3 6"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="2.4s" repeatCount="indefinite"/></polygon>
  </g>

  <!-- orchestrator: two staggered pulse rings, core, sparkle -->
  <g>
    <circle cx="200" cy="200" r="30" fill="none" stroke="#58A6FF" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="30;62" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="30" fill="none" stroke="#58A6FF" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="30;62" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="28" fill="url(#core)"/>
    <g transform="translate(200 200)">
      <path d="M0 -13 Q1.6 -1.6 13 0 Q1.6 1.6 0 13 Q-1.6 1.6 -13 0 Q-1.6 -1.6 0 -13Z" fill="#ffffff">
        <animateTransform attributeName="transform" type="scale" values="1;1.16;1" dur="3.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- agents -->
  <g>
    <g>
      <circle cx="200.0" cy="92.0" r="15" fill="#0d1117" stroke="#58A6FF" stroke-width="1.4"/>
      <circle cx="200.0" cy="92.0" r="4.6" fill="#58A6FF">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="-0.00s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.6;5.4;3.6" dur="3.2s" begin="-0.00s" repeatCount="indefinite"/>
      </circle>
      <text class="lab" x="200.0" y="68.0" text-anchor="middle">PLAN</text>
    </g>
    <g>
      <circle cx="293.5" cy="146.0" r="15" fill="#0d1117" stroke="#58A6FF" stroke-width="1.4"/>
      <circle cx="293.5" cy="146.0" r="4.6" fill="#58A6FF">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="-0.53s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.6;5.4;3.6" dur="3.2s" begin="-0.53s" repeatCount="indefinite"/>
      </circle>
      <text class="lab" x="317.5" y="150.0" text-anchor="start">RAG</text>
    </g>
    <g>
      <circle cx="293.5" cy="254.0" r="15" fill="#0d1117" stroke="#58A6FF" stroke-width="1.4"/>
      <circle cx="293.5" cy="254.0" r="4.6" fill="#58A6FF">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="-1.06s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.6;5.4;3.6" dur="3.2s" begin="-1.06s" repeatCount="indefinite"/>
      </circle>
      <text class="lab" x="317.5" y="258.0" text-anchor="start">GRAPH</text>
    </g>
    <g>
      <circle cx="200.0" cy="308.0" r="15" fill="#0d1117" stroke="#58A6FF" stroke-width="1.4"/>
      <circle cx="200.0" cy="308.0" r="4.6" fill="#58A6FF">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="-1.59s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.6;5.4;3.6" dur="3.2s" begin="-1.59s" repeatCount="indefinite"/>
      </circle>
      <text class="lab" x="200.0" y="340.0" text-anchor="middle">TOOLS</text>
    </g>
    <g>
      <circle cx="106.5" cy="254.0" r="15" fill="#0d1117" stroke="#58A6FF" stroke-width="1.4"/>
      <circle cx="106.5" cy="254.0" r="4.6" fill="#58A6FF">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="-2.12s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.6;5.4;3.6" dur="3.2s" begin="-2.12s" repeatCount="indefinite"/>
      </circle>
      <text class="lab" x="82.5" y="258.0" text-anchor="end">CRITIC</text>
    </g>
    <g>
      <circle cx="106.5" cy="146.0" r="15" fill="#0d1117" stroke="#58A6FF" stroke-width="1.4"/>
      <circle cx="106.5" cy="146.0" r="4.6" fill="#58A6FF">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" begin="-2.65s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3.6;5.4;3.6" dur="3.2s" begin="-2.65s" repeatCount="indefinite"/>
      </circle>
      <text class="lab" x="82.5" y="150.0" text-anchor="end">MEMORY</text>
    </g>
  </g>

  <!-- messages in flight -->
  <g>
    <circle r="3.3" fill="#58A6FF" opacity="0">
      <animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" path="M200,200 L200.0,92.0" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1" keyPoints="0;1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.84;1" dur="2.6s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.3" fill="#58A6FF" opacity="0">
      <animateMotion dur="2.6s" begin="0.43s" repeatCount="indefinite" path="M293.5,146.0 L200,200" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1" keyPoints="0;1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.84;1" dur="2.6s" begin="0.43s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.3" fill="#58A6FF" opacity="0">
      <animateMotion dur="2.6s" begin="0.86s" repeatCount="indefinite" path="M200,200 L293.5,254.0" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1" keyPoints="0;1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.84;1" dur="2.6s" begin="0.86s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.3" fill="#58A6FF" opacity="0">
      <animateMotion dur="2.6s" begin="1.29s" repeatCount="indefinite" path="M200.0,308.0 L200,200" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1" keyPoints="0;1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.84;1" dur="2.6s" begin="1.29s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.3" fill="#58A6FF" opacity="0">
      <animateMotion dur="2.6s" begin="1.72s" repeatCount="indefinite" path="M200,200 L106.5,254.0" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1" keyPoints="0;1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.84;1" dur="2.6s" begin="1.72s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.3" fill="#58A6FF" opacity="0">
      <animateMotion dur="2.6s" begin="2.15s" repeatCount="indefinite" path="M106.5,146.0 L200,200" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1" keyPoints="0;1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.14;.84;1" dur="2.6s" begin="2.15s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
